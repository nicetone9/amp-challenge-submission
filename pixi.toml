[workspace]
name = "amp-challenge-submission"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
uv = ">=0.6,<1"
r-base = "4.4.*"
r-kaos = "0.1.2.*"
cd-hit = "4.8.1.*"

[pypi-dependencies]
amp-challenge-submission = { path = ".", editable = true, extras = ["legacy-oracles"] }
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu126" }

# Minimal native prerequisites for the uv submission entry; no R or oracle stack.
[feature.runtime.dependencies]
python = "3.11.*"
uv = ">=0.6,<1"
cd-hit = "4.8.1.*"

[environments]
runtime = { features = ["runtime"], no-default-feature = true }

[tasks]
test = "python -m unittest discover -s tests -v"
generate = "generate"
verify-submission = "python scripts/verify_submission.py"
check-assets = "python -c \"from amp_submission.io import verify_assets; verify_assets('checkpoint'); verify_assets('external'); print('asset hashes passed')\""

prepare-reference = "python -m amp_submission.prepare_reference"
score-descriptors = "python -m amp_submission.score_stage descriptors"
score-novelty = "python -m amp_submission.score_stage novelty"
score-oracles = "python -m amp_submission.score_stage oracles"
calibrate = "python -m amp_submission.score_stage calibrate"

track-audit = "python -m amp_submission.track_audit"
swanlab-status = "swanlab api run summary"
swanlab-sync = "swanlab sync"

score-embedding = "python -m amp_submission.embedding_stage"

expand-pool = "python -m amp_submission.expand_pool"

motif-check = "python -m amp_submission.motifs"

audit-official-reference = "python -m amp_submission.hard_audit"
select-hard-library = "python -m amp_submission.hard_select"
select-motif-top = "python -m amp_submission.motif_select"
freeze-generation-reference = "python scripts/freeze_generation_reference.py"
uv-generate = "uv run generate"
reproduce-from-model = "python scripts/reproduce_from_model.py"
test-uv = "uv run --frozen python -m unittest discover -s tests -v"
verify-length-hard-only = "python scripts/verify_length_hard_only.py"
track-length-hard-only = "python scripts/track_length_hard_only.py"
freeze-candidate-pool = "python scripts/freeze_candidate_pool.py"
reproduce-frozen-pool = "python scripts/reproduce_frozen_pool.py"
