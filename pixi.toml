[workspace]
name = "amp-challenge-submission"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
uv = ">=0.6,<1"
r-base = "4.4.*"
r-kaos = "0.1.2.*"
cd-hit = "4.8.1.*"

[pypi-dependencies]
amp-challenge-submission = { path = ".", editable = true }
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu126" }

[tasks]
test = "python -m unittest discover -s tests -v"
generate = "generate"
verify-submission = "python scripts/verify_submission.py"
check-assets = "python -c \"from amp_submission.io import verify_assets; verify_assets('checkpoint'); verify_assets('external'); print('asset hashes passed')\""

prepare-reference = "python -m amp_submission.prepare_reference"
score-descriptors = "python -m amp_submission.score_stage descriptors"
score-novelty = "python -m amp_submission.score_stage novelty"
score-oracles = "python -m amp_submission.score_stage oracles"
calibrate = "python -m amp_submission.score_stage calibrate"

track-audit = "python -m amp_submission.track_audit"
swanlab-status = "swanlab api run summary"
swanlab-sync = "swanlab sync"

score-embedding = "python -m amp_submission.embedding_stage"

expand-pool = "python -m amp_submission.expand_pool"

motif-check = "python -m amp_submission.motifs"

audit-official-reference = "python -m amp_submission.hard_audit"
